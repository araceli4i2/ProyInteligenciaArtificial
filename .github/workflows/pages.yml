name: Deploy static web dashboard to GitHub Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

# Permisos requeridos para desplegar a GitHub Pages con OIDC
permissions:
  contents: read
  pages: write
  id-token: write

# Permite solo un despliegue concurrente, saltándose ejecuciones pendientes
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto web
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'web'

      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
